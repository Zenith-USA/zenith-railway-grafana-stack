global:
  scrape_interval: 15s
  external_labels:
    environment: ${ENVIRONMENT:-development}

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'zenith-api'
    scheme: ${ZENITH_API_SCHEME:-http}
    static_configs:
      - targets: ['${ZENITH_API_TARGET:-host.docker.internal:8000}']
        labels:
          environment: '${ENVIRONMENT:-development}'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Celery task/worker metrics from Flower's event stream
  - job_name: 'flower'
    static_configs:
      - targets: ['${FLOWER_TARGET:-flower:5555}']
        labels:
          environment: '${ENVIRONMENT:-development}'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Broker metrics incl. per-queue depth, via the rabbitmq_prometheus plugin
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['${RABBITMQ_TARGET:-rabbitmq:15692}']
        labels:
          environment: '${ENVIRONMENT:-development}'
    metrics_path: '/metrics'
    scrape_interval: 15s