apiVersion: 1

contactPoints:
  - orgId: 1
    name: PagerDuty
    receivers:
      - uid: pagerduty
        type: pagerduty
        settings:
          integrationKey: $PAGERDUTY_INTEGRATION_KEY
          severity: "{{ .CommonLabels.severity }}"
        disableResolveMessage: false

  - orgId: 1
    name: TelegramCritical
    receivers:
      - uid: telegram-critical
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: "${TELEGRAM_ALERT_CHAT_ID} "
          parse_mode: HTML
          disable_web_page_preview: true
          message: |
            <b>{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}</b>
            {{ range .Alerts -}}
            {{ .Annotations.summary }}
            {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
            {{ end -}}
        disableResolveMessage: false

  - orgId: 1
    name: TelegramWarning
    receivers:
      - uid: telegram-warning
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: "${TELEGRAM_WARN_CHAT_ID} "
          parse_mode: HTML
          disable_web_page_preview: true
          message: |
            <b>{{ if eq .Status "firing" }}🟡{{ else }}✅{{ end }} {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}</b>
            {{ range .Alerts -}}
            {{ .Annotations.summary }}
            {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
            {{ end -}}
        disableResolveMessage: false

policies:
  # Default route is Warnings; critical alerts break out to the Alerts group.
  - orgId: 1
    receiver: TelegramWarning
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: TelegramCritical
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h

groups:
  - orgId: 1
    name: Zenith Critical Alerts
    folder: Zenith
    interval: 1m
    rules:
      # High API Error Rate (>5% 5xx for 5 min)
      - uid: api-error-rate
        title: High API Error Rate
        condition: C
        noDataState: NoData
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: last_over_time((sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m])))[5m:])
              instant: false
              range: true
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: last_over_time((sum(rate(http_request_duration_seconds_count[5m])))[5m:])
              instant: false
              range: true
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: ($B > 0) && (($A / $B) * 100 > 5)
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx error rate exceeds 5%"
          description: "The API is returning a high percentage of 5xx errors. Check application logs for the root cause."

      # Celery Task Failure Spike (>10% failure rate for 5 min)
      - uid: celery-failure-spike
        title: Celery Task Failure Spike
        condition: C
        noDataState: NoData
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: last_over_time((sum(rate(flower_events_total{type="task-failed"}[5m])))[5m:])
              instant: false
              range: true
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: last_over_time((sum(rate(flower_events_total{type="task-received"}[5m])))[5m:])
              instant: false
              range: true
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: ($B > 0) && (($A / $B) * 100 > 10)
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Celery task failure rate exceeds 10%"
          description: "A high percentage of Celery tasks are failing. Check worker logs and task error details."


      # Scrape Target Down (any Prometheus target unreachable for 5 min)
      - uid: scrape-target-down
        title: Scrape Target Down
        condition: A
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: up == 0
              instant: false
              range: true
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "{{ $labels.instance }} has not responded to scrapes for 5 minutes. Metrics from this service are missing."

      # Redis Unreachable (exporter is up but cannot reach Redis)
      - uid: redis-unreachable
        title: Redis Unreachable
        condition: A
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: redis_up == 0
              instant: false
              range: true
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis is unreachable"
          description: "redis_exporter is running but cannot connect to Redis. Garmin backfill rate-limit state and the notification mute switch are unavailable."

      # No Celery Workers Online
      - uid: no-celery-workers
        title: No Celery Workers Online
        condition: A
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: count(flower_worker_online == 1) < 2
              instant: false
              range: true
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Fewer than 2 Celery workers online"
          description: "Worker death was completely silent during the 2026-08-18 outage. Check the Celery Main service in Railway."

      # Webhook Processing Failures (>5% failure rate for 5 min)
      - uid: webhook-failures
        title: Webhook Processing Failures
        condition: C
        noDataState: NoData
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: last_over_time((sum(rate(zenith_webhooks_received_total{status="failed"}[5m])))[5m:])
              instant: false
              range: true
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: last_over_time((sum(rate(zenith_webhooks_received_total[5m])))[5m:])
              instant: false
              range: true
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: ($B > 0) && (($A / $B) * 100 > 5)
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Webhook failure rate exceeds 5%"
          description: "Webhook processing is failing at a high rate. Data ingestion from providers may be impacted."

      # DISABLED: zenith_db_connections died with the pushgateway (worker-emitted).
      # Re-enable against postgres_exporter's pg_stat_activity_count. See ZEN-486.
      - uid: db-connection-exhaustion
        title: Database Connection Exhaustion
        condition: A
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: zenith_db_connections{state="active"} > 48
              instant: false
              range: true
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool near exhaustion (>80%)"
          description: "Active database connections exceed 48 out of 60 max (pool_size=20 + max_overflow=40). Application may start rejecting requests."

      # Auth Failure Spike (>20% failure rate for 5 min)
      - uid: auth-failure-spike
        title: Auth Failure Spike
        condition: C
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: last_over_time((sum(rate(zenith_auth_attempts_total{result="failure"}[5m])))[5m:])
              instant: false
              range: true
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: last_over_time((sum(rate(zenith_auth_attempts_total[5m])))[5m:])
              instant: false
              range: true
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: ($B > 0) && (($A / $B) * 100 > 20)
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Authentication failure rate exceeds 20%"
          description: "Users are unable to sign in. Check Apple Sign In, Magic Link, and JWT token verification."

      # Token Refresh Failures (>10% failure rate for 5 min)
      - uid: token-refresh-failures
        title: Token Refresh Failures
        condition: C
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: last_over_time((sum(rate(zenith_token_refresh_attempts_total{result=~"expired|error"}[5m])))[5m:])
              instant: false
              range: true
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: last_over_time((sum(rate(zenith_token_refresh_attempts_total[5m])))[5m:])
              instant: false
              range: true
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: ($B > 0) && (($A / $B) * 100 > 10)
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Token refresh failure rate exceeds 10%"
          description: "Users are getting logged out because token refreshes are failing. Mass session invalidation may be occurring."

  - orgId: 1
    name: Zenith Warning Alerts
    folder: Zenith
    interval: 1m
    rules:
      # API Latency Spike (p95 >2s for 5 min)
      - uid: api-latency-spike
        title: API Latency Spike
        condition: A
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: last_over_time((histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2)[5m:])
              instant: false
              range: true
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency exceeds 2 seconds"
          description: "The API is responding slowly. Check database query times, external API calls, and resource utilization."

      # Celery Queue Backing Up (>100 messages for 10 min)
      - uid: celery-queue-backlog
        title: Celery Queue Backing Up
        condition: A
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: sum(rabbitmq_queue_messages_ready{queue!~"celeryev.*|.*pidbox"}) > 100
              instant: false
              range: true
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue depth exceeds 100 tasks"
          description: "Tasks are accumulating faster than workers can process them. Consider scaling workers or investigating slow tasks."

      # Push Notification Failures (>30% failure rate for 15 min)
      - uid: push-notification-failures
        title: Push Notification Failures
        condition: C
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: last_over_time((sum(rate(zenith_push_notifications_total{result="failed"}[15m])))[5m:])
              instant: false
              range: true
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: last_over_time((sum(rate(zenith_push_notifications_total[15m])))[5m:])
              instant: false
              range: true
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: ($B > 0) && (($A / $B) * 100 > 30)
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Push notification failure rate exceeds 30%"
          description: "A high percentage of push notifications are failing to deliver. Check APNs configuration and device token validity."
