version: '3.8'

services:
    
  prometheus:
    build:
      context: ./prometheus
      dockerfile: dockerfile
      args:
        VERSION: latest
    user: root
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    environment:
      - ZENITH_API_TARGET=${ZENITH_API_TARGET:-host.docker.internal:8000}
      # Local API is plain HTTP; Railway sets this to https
      - ZENITH_API_SCHEME=${ZENITH_API_SCHEME:-http}
      - PUSHGATEWAY_TARGET=${PUSHGATEWAY_TARGET:-pushgateway:9091}
      # Stamped onto every series as an external label
      - ENVIRONMENT=${ENVIRONMENT:-development}

  pushgateway:
    build:
      context: ./pushgateway
      dockerfile: dockerfile
      args:
        VERSION: latest
    user: root
    ports:
      - "9091:9091"
    volumes:
      - pushgateway_data:/data

  loki:
    build:
      context: ./loki
      dockerfile: dockerfile
      args:
        VERSION: latest
    user: root
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  tempo:
    build:
      context: ./tempo
      dockerfile: dockerfile
      args:
        VERSION: "2.6.1"
    user: root
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - tempo_data:/var/tempo

  grafana:
    build:
      context: ./grafana
      dockerfile: dockerfile
      args:
        VERSION: latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=yourpassword123
      - GF_DEFAULT_INSTANCE_NAME=Grafana
      - GF_INSTALL_PLUGINS=grafana-simple-json-datasource,grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel
      - LOKI_INTERNAL_URL=http://loki:3100
      - PROMETHEUS_INTERNAL_URL=http://prometheus:9090
      - TEMPO_INTERNAL_URL=http://tempo:3200
      - PAGERDUTY_INTEGRATION_KEY=${PAGERDUTY_INTEGRATION_KEY:-dummy-local-key-never-fires}
      # Dummy defaults keep Grafana bootable locally — provisioning rejects an
      # empty bottoken. Real values live on the Railway Grafana service only.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-dummy-local-token-never-fires}
      - TELEGRAM_ALERT_CHAT_ID=${TELEGRAM_ALERT_CHAT_ID:-0}
      - TELEGRAM_WARN_CHAT_ID=${TELEGRAM_WARN_CHAT_ID:-0}

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  tempo_data:
  pushgateway_data: